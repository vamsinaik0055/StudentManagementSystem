
spring:
  application:
    name: student-management

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/student_management}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}
  address: 0.0.0.0

app:
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}
